<title>G&amp;L PDF</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&family=Mrs+Saint+Delafield&family=Caveat:wght@500&display=swap">
<style>
/* Layout: one-screen workshop app — header, tool strip, context bar, then page thumbnails beside a scrolling document. */
:root{
  --bg:#e7e9ec; --panel:#f8f9fa; --ink:#1d2328; --muted:#5d6670; --line:#d3d7dc;
  --accent:#b0532a; --accent-ink:#ffffff; --accent-soft:rgba(176,83,42,.12); --steel:#2b3238;
  --f-ui:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-brand:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15191c; --panel:#1e2327; --ink:#e7eaed; --muted:#9aa3ac; --line:#323a40;
  --accent:#d26c3f; --accent-ink:#1a0f09; --accent-soft:rgba(210,108,63,.16); --steel:#0f1214; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15191c; --panel:#1e2327; --ink:#e7eaed; --muted:#9aa3ac; --line:#323a40;
  --accent:#d26c3f; --accent-ink:#1a0f09; --accent-soft:rgba(210,108,63,.16); --steel:#0f1214; color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;overflow:hidden}
.app{height:100%;display:grid;grid-template-rows:auto auto auto auto 1fr;min-height:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* header */
.top{background:var(--steel);color:#eef1f3;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--f-brand);font-weight:700;font-size:20px;letter-spacing:.02em;display:flex;align-items:center;gap:8px;margin-right:6px}
.brand b{background:var(--accent);color:#fff;padding:1px 7px;border-radius:3px;font-size:15px;letter-spacing:.06em}
.tbtn{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:6px;color:#e6eaed;white-space:nowrap}
.tbtn:hover{background:rgba(255,255,255,.09)}
.tbtn:disabled{opacity:.35;cursor:default;background:none}
.fname{flex:1 1 140px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#aeb7bf;font-size:13px}
.zoom{display:flex;align-items:center;gap:2px;background:rgba(255,255,255,.07);border-radius:7px;padding:2px}
.zoom span{min-width:46px;text-align:center;font-variant-numeric:tabular-nums;font-size:13px}
.zoom button{padding:6px 8px;border-radius:5px}.zoom button:hover{background:rgba(255,255,255,.1)}
.save{background:var(--accent);color:#fff;font-weight:600;padding:8px 14px;border-radius:6px;display:inline-flex;gap:7px;align-items:center}
.save:hover{filter:brightness(1.08)}

/* tools */
.tools{background:var(--panel);border-bottom:1px solid var(--line);display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin;
  padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tool{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 10px;border-radius:7px;color:var(--muted);font-size:12px;font-weight:500;white-space:nowrap;min-width:64px}
.tool:hover{background:var(--accent-soft);color:var(--ink)}
.tool[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.sep{width:1px;background:var(--line);margin:4px 6px;flex:none}

/* context bar */
.ctx{background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-height:40px;box-sizing:border-box;font-size:13px;color:var(--muted);
  padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ctx label{display:flex;align-items:center;gap:6px}
.ctx select,.ctx input[type=number]{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:4px 6px;font:inherit}
.ctx input[type=number]{width:62px}
.ctx input[type=color]{width:30px;height:26px;border:1px solid var(--line);border-radius:5px;padding:1px;background:var(--bg)}
.chip{border:1px solid var(--line);border-radius:5px;padding:4px 9px;font-weight:600;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.hint{color:var(--muted)}
.ctx[hidden]{display:none}
button,.tool,.ti,.th{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.top{padding-top:max(8px,env(safe-area-inset-top,0px))}
.viewer{padding-bottom:calc(60px + env(safe-area-inset-bottom,0px))}
.share-big{font-size:16px;padding:12px 18px;justify-content:center}
.danger{color:#c0392b;border:1px solid currentColor;border-radius:5px;padding:4px 9px;font-weight:600}

/* main */
.main{display:grid;grid-template-columns:272px 1fr;min-height:0}
.side{background:var(--panel);border-right:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column;min-height:0}
.stabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.stab{flex:1;padding:10px 4px;font-weight:600;font-size:13px;color:var(--muted);border-bottom:2px solid transparent}
.stab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.spanel{overflow-y:auto;padding:10px;flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
.tgroup{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
.tgroup h3{font-family:var(--f-brand);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:6px 6px 4px}
.tact{display:flex;align-items:center;gap:10px;text-align:left;padding:7px 8px;border-radius:7px;font-size:13.5px;color:var(--ink)}
.tact:hover{background:var(--accent-soft)}
.tact svg.i{color:var(--accent)}
.tact small{display:block;color:var(--muted);font-size:11.5px;line-height:1.25}
.tact[disabled]{opacity:.45;cursor:not-allowed}
.cmt-item{display:flex;gap:8px;align-items:flex-start;padding:8px;border-radius:7px;border:1px solid var(--line);font-size:13px;cursor:pointer;background:var(--bg)}
.cmt-item:hover{border-color:var(--accent)}
.cmt-item .sw2{width:10px;height:10px;border-radius:2px;flex:none;margin-top:4px}
.cmt-item .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.cmt-item .tx b{display:block;font-size:12px;color:var(--muted);font-weight:600}
.cmt-item button{color:var(--muted);padding:0 4px}
.form-grid{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center;font-size:13px}
.form-grid input[type=text],.form-grid input[type=number],.form-grid input[type=password],.form-grid select,.form-grid textarea{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit;min-width:0;width:100%;box-sizing:border-box}
.pos6{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.pos6 input{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit;min-width:0}
.org{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px;overflow:auto;max-height:62vh;padding:4px}
.org .oc{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px;border-radius:8px;border:2px solid transparent;cursor:pointer;background:var(--bg)}
.org .oc.on{border-color:var(--accent);background:var(--accent-soft)}
.org .oc canvas{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);max-width:100%}
.org .oc.dragover{outline:2px dashed var(--accent)}
.flist{display:flex;flex-direction:column;gap:6px;max-height:40vh;overflow:auto}
.flist .fi{display:flex;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-size:13px}
.flist .fi span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card.wide{width:min(980px,100%)}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.prog>div{height:100%;background:var(--accent);width:0}
.deco{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lnk{position:absolute;cursor:pointer}
.app.tool-select .lnk:hover{background:rgba(59,111,216,.12);outline:1px solid rgba(59,111,216,.5)}
.app:not(.tool-select) .lnk{pointer-events:none}
.cropmask{position:absolute;background:rgba(20,24,28,.45);pointer-events:none}
.obj.field{border:1.5px dashed #3b6fd8;background:rgba(214,226,255,.45);color:#2a4fa8;font:600 10px var(--f-ui);display:flex;align-items:flex-start;padding:1px 3px;box-sizing:border-box;overflow:hidden;white-space:nowrap}
.obj.link{border:1.5px dashed #3b6fd8;background:rgba(59,111,216,.08)}
.obj.redact{background:rgba(0,0,0,.35);outline:1.5px solid #c0392b}
.obj.redact.applied{background:#000}
.pgnum{display:flex;align-items:center;gap:4px;font-size:13px;color:#aeb7bf}
.pgnum input{width:42px;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:5px;padding:4px 4px;text-align:center;font:inherit}
.menu{position:absolute;z-index:45;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:6px;display:flex;flex-direction:column;min-width:240px}
.menu button{text-align:left;padding:8px 10px;border-radius:6px;font-size:13.5px}.menu button:hover{background:var(--accent-soft)}
.side h2{font-family:var(--f-brand);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 -4px}
.th{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;border-radius:6px;padding:6px 4px}
.th.cur{background:var(--accent-soft)}
.th canvas{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);max-width:100%}
.th .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.th .acts{display:flex;gap:2px}
.th .acts button{padding:3px;border-radius:4px;color:var(--muted)}.th .acts button:hover{background:var(--line);color:var(--ink)}
.th .acts svg.i{width:15px;height:15px}
.viewer{overflow:auto;min-width:0;position:relative;touch-action:pan-x pan-y;padding-block:24px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pages{display:flex;flex-direction:column;align-items:center;gap:20px;width:max-content;min-width:100%}
.pages:has(>.empty){width:auto}
.page{position:relative;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18),0 6px 22px rgba(0,0,0,.12);flex:none;touch-action:pan-x pan-y}
.page>canvas{position:absolute;inset:0;width:100%;height:100%}
.page .tl,.page .objs{position:absolute;inset:0}
.page .objs{pointer-events:none}
.page .objs .obj{pointer-events:auto}
.fstat{font-size:12px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink)}
.fstat.ok{border-color:#3d8b57;color:#3d8b57}
.fstat.warn{border-color:#b7791f;color:#b7791f}
.page svg.ink{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.page svg.ink path{pointer-events:none}
.tool-select .page svg.ink path{pointer-events:stroke;cursor:pointer}
.tool-text .page,.tool-edit .page{cursor:text}
.tool-hl .page,.tool-wipe .page,.tool-draw .page,.tool-shape .page,.tool-strike .page,.tool-link .page,.tool-crop .page,.tool-field .page,.tool-redact .page{cursor:crosshair;touch-action:none}
.tool-check .page,.tool-note .page,.tool-date .page{cursor:copy}
.tool-place .page{cursor:copy;touch-action:none}
.ti{position:absolute;cursor:text;border-radius:2px}
.ti:hover{background:var(--accent-soft);outline:1px dashed #b0532a}
.obj{position:absolute}
.app.tool-draw .obj:not(.sel),.app.tool-hl .obj:not(.sel),.app.tool-wipe .obj:not(.sel),.app.tool-shape .obj:not(.sel),.app.tool-strike .obj:not(.sel),.app.tool-link .obj:not(.sel),.app.tool-crop .obj:not(.sel),.app.tool-redact .obj:not(.sel){pointer-events:none}
.obj .del,.obj .grip,.obj .rs{pointer-events:auto}
.obj.box{touch-action:none}
.obj.note{width:22px;height:22px;cursor:pointer}
.obj.note .ico{width:22px;height:22px;display:block}
.obj.note .pop{position:absolute;left:0;top:28px;width:220px;background:#fffbe6;border:1px solid #e0c35a;border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.18);padding:6px;display:none;z-index:5}
.obj.note.sel .pop{display:block}
.obj.note textarea{width:100%;min-height:70px;border:0;background:transparent;font:13px/1.35 var(--f-ui);color:#1d2328;resize:vertical;outline:none}
.obj.shape svg{width:100%;height:100%;display:block;overflow:visible}
.cmt{position:absolute;width:20px;height:20px;cursor:help;z-index:2}
.fl{position:absolute;inset:0;pointer-events:none}
.fl .ff{position:absolute;pointer-events:auto;box-sizing:border-box;border:0;margin:0;padding:0 2px;background:rgba(214,226,255,.55);color:#000;font-family:Helvetica,Arial,sans-serif;outline:none;border-radius:1px}
.fl .ff:hover{background:rgba(190,208,255,.7)}
.fl .ff:focus{background:rgba(214,226,255,.85);box-shadow:0 0 0 1.5px #3b6fd8}
.fl textarea.ff{resize:none;line-height:1.15}
.fl .ff[disabled]{background:transparent}
.fl .fcb{display:grid;place-items:center;cursor:pointer;padding:0}
.fl .fcb.radio{border-radius:50%}
.fl .fcb svg{width:80%;height:80%}
.fl .fsig{display:grid;place-items:center;cursor:pointer;color:#3b6fd8;font:600 11px var(--f-ui);background:rgba(214,226,255,.35);border:1px dashed #3b6fd8}
.hits{position:absolute;inset:0;pointer-events:none}
.hit{position:absolute;background:rgba(255,200,0,.38);border-radius:2px}
.hit.cur{background:rgba(255,120,0,.55);box-shadow:0 0 0 2px rgba(255,120,0,.7)}
.ghost{position:absolute;opacity:.55;pointer-events:none;z-index:4}
.search{display:flex;align-items:center;gap:8px;background:var(--panel);border-bottom:1px solid var(--line);font-size:13px;color:var(--muted);
  padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.search input{flex:0 1 280px;min-width:0;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:5px 8px;font:inherit}
.search button{border:1px solid var(--line);border-radius:5px;padding:4px 9px;color:var(--ink)}
.th[draggable="true"]{cursor:grab}
.th.dragover{outline:2px dashed var(--accent);outline-offset:2px}
#printArea{display:none}
@media print{
  @page{margin:0}
  html,body{height:auto;overflow:visible;background:#fff}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block}
  #printArea img{display:block;width:100%;height:auto;page-break-after:always;break-after:page}
  #printArea img:last-child{page-break-after:auto;break-after:auto}
}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px}
.keys kbd{font:600 12px var(--f-ui);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:2px 6px;white-space:nowrap}
#bPages{display:none}
@media (max-width:760px){#bPages{display:inline-flex}.show-side .side{display:flex;position:fixed;left:0;top:0;bottom:0;width:280px;max-width:88vw;z-index:40;box-shadow:4px 0 20px rgba(0,0,0,.25);padding-top:max(12px,env(safe-area-inset-top,0px))}}
.obj.sel{outline:1.5px solid #b0532a;outline-offset:2px}
.obj .del,.obj .grip,.obj .rs{display:none;position:absolute}
.obj.sel .del,.obj.sel .grip,.obj.sel .rs{display:grid}
.obj .del{top:-14px;right:-14px;width:22px;height:22px;border-radius:50%;background:#b0532a;color:#fff;place-items:center;font-size:14px;line-height:1;z-index:3}
.obj .grip{top:-14px;left:-14px;width:22px;height:22px;border-radius:50%;background:#2b3238;color:#fff;place-items:center;cursor:move;z-index:3;touch-action:none}
.obj .rs{right:-6px;bottom:-6px;width:12px;height:12px;background:#fff;border:2px solid #b0532a;border-radius:2px;cursor:nwse-resize;touch-action:none}
.obj.box{cursor:move}
.obj.txt .grip{top:-28px;left:-2px}
.obj.txt .del{top:-28px;right:-2px}
.obj.hl{mix-blend-mode:multiply}
.obj.img img{width:100%;height:100%;display:block;pointer-events:none;user-select:none}
.wipe-under{position:absolute;pointer-events:none}
.ed{white-space:pre;outline:none;line-height:1.2;min-width:6px;cursor:text}
.ed:empty::before{content:"Tapez votre texte";color:#9aa3ac}
.drop{position:absolute;inset:16px;border:2px dashed var(--accent);border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);font-size:16px;font-weight:600;pointer-events:none;z-index:20}
.empty{max-width:420px;margin:12vh auto;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty h1{font-family:var(--f-brand);color:var(--ink);font-size:28px;margin:0}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,12,14,.55);display:grid;place-items:center;z-index:50;padding:16px}
.card{background:var(--panel);color:var(--ink);border-radius:12px;width:min(640px,100%);max-height:100%;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.card h2{font-family:var(--f-brand);font-size:22px;margin:0}
.tabs{display:flex;gap:6px}
.tabs button{padding:6px 12px;border-radius:6px;border:1px solid var(--line);font-weight:500}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pad{background:#fff;border:1px solid var(--line);border-radius:8px;width:100%;aspect-ratio:3/1;max-width:100%;touch-action:none;cursor:crosshair;display:block}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row input[type=text]{flex:1 1 200px;min-width:0;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:inherit}
.btn{padding:8px 14px;border-radius:6px;border:1px solid var(--line);font-weight:500}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.saved{display:flex;gap:8px;flex-wrap:wrap}
.saved .s{position:relative;background:#fff;border:1px solid var(--line);border-radius:6px;padding:4px;cursor:pointer;height:58px;display:grid;place-items:center}
.saved .s img{max-height:48px;max-width:150px}
.saved .s button{position:absolute;top:-8px;right:-8px;width:20px;height:20px;border-radius:50%;background:var(--steel);color:#fff;font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--steel);color:#fff;padding:10px 14px;border-radius:8px;display:flex;gap:12px;align-items:center;z-index:60;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.3);font-size:13px}
.toast{pointer-events:none}.toast button,.toast a{color:#f0a37f;font-weight:600;pointer-events:auto}
.busy{position:fixed;inset:0;display:grid;place-items:center;background:rgba(10,12,14,.35);z-index:70;color:#fff;font-weight:600;font-size:15px}
@media (max-width:760px){.ctx{flex-wrap:nowrap;overflow-x:auto;white-space:nowrap;scrollbar-width:none}.ctx>*{flex:none}.main{grid-template-columns:1fr}.side{display:none}.fname{display:none}.tbtn .lb{display:none}}
/* barre du haut : même ordre qu'avant sur ordinateur, menu « ⋯ » sur téléphone */
.secbar{display:contents}#bMore{display:none}.lb.m{display:none}
.top .brand{order:1}#bOpen{order:2}#bPages{order:3}#bCreate{order:4}#bAdd{order:5}#fname{order:6}#bFind{order:7}#bPrint{order:8}#bUndo{order:9}#bRedo{order:10}.top .zoom{order:11}#pInfo{order:12}#bClaude{order:13}#bHelp{order:13}#bMore{order:14}#bSave{order:15}
@media (max-width:760px){

<script>
(function(){
const pdfjs = window.pdfjsLib;
pdfjs.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10);
const DPR = Math.min(2, window.devicePixelRatio || 1);
const FONTS = { helv:'Helvetica, Arial, sans-serif', times:'"Times New Roman", Times, serif', courier:'"Courier New", Courier, monospace' };

const S = {
  docs: [], pages: [], proxies: {}, items: {},
  scale: 1, tool: 'select', sel: null, hist: [], fut: [],
  name: '', pending: null, form: {}, annots: {}, dirty: false, path: null, doc: {},
  props: { size: 12, color: '#111111', bold: false, font: 'helv', inkW: 2, inkC: '#1f4fbf', hlC: '#ffe14d',
    mark: 'check', markC: '#1f4fbf', shape: 'rect', shapeC: '#d0312d', shapeW: 2, strike: 'strike', strikeC: '#d0312d', wipeC: '#ffffff' },
};
const IN_CLAUDE = !!(window.claude && window.claude.use);
const ELECTRON = !!window.glApp;
const app = $('#app'), pagesEl = $('#pages'), viewer = $('#viewer'), thumbs = $('#thumbs'), ctx = $('#ctx');

/* ---------- helpers ---------- */
const key = p => p.doc + ':' + p.index;
const proxy = p => S.proxies[key(p)];
const totalRot = p => ((proxy(p).rotate || 0) + p.rot) % 360;
const getVP = (p, scale) => proxy(p).getViewport({ scale, rotation: totalRot(p) });
const snap = () => JSON.stringify({ pages: S.pages.map(({id,doc,index,rot,objs,ocr,crop}) => ({id,doc,index,rot,objs,ocr,crop})), form: S.form, doc: S.doc });
function setDirty(v){
  S.dirty = v;
  if (S.name) document.title = (v ? '• ' : '') + S.name + ' – G&L PDF';
}
let cmtT; function pushHist(s){ S.hist.push(s || snap()); if (S.hist.length > 100) S.hist.shift(); S.fut = []; setDirty(true); updUndo(); clearTimeout(cmtT); cmtT = setTimeout(() => { if (typeof curPanel !== 'undefined' && curPanel === 'comments') renderComments(); }, 120); }
function restore(s){ const st = JSON.parse(s); S.pages = st.pages; S.form = st.form || {}; S.doc = st.doc || {}; S.sel = null; renderAll(true); updUndo(); setDirty(true); renderComments(); }
/* the Windows menu and the page can both react to the same shortcut: run each action once */
const lastRun = {};
function once(name, ms){ const t = Date.now(); if (lastRun[name] && t - lastRun[name] < (ms || 300)) return false; lastRun[name] = t; return true; }
function undo(){ if (!once('undo', 150)) return; if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); if (!S.hist.length) return; S.fut.push(snap()); restore(S.hist.pop()); }
function redo(){ if (!once('redo', 150)) return; if (!S.fut.length) return; S.hist.push(snap()); restore(S.fut.pop()); }
function updUndo(){ $('#bUndo').disabled = !S.hist.length; $('#bRedo').disabled = !S.fut.length; }
function findObj(id){ for (const p of S.pages){ const o = p.objs.find(o => o.id === id); if (o) return { p, o }; } return null; }
function pageEl(p){ return pagesEl.querySelector('.page[data-id="' + p.id + '"]'); }
function hexToRgb(h){ const n = parseInt(h.slice(1), 16); return PDFLib.rgb(((n>>16)&255)/255, ((n>>8)&255)/255, (n&255)/255); }

let toastT;
const TOUCH = !!(window.matchMedia && matchMedia('(pointer:coarse)').matches);
const forTouch = m => TOUCH ? String(m).replace(/Cliquez sur/g, 'Touchez').replace(/cliquez sur/g, 'touchez').replace(/Cliquez/g, 'Touchez').replace(/cliquez/g, 'touchez').replace(/ Suppr pour l’effacer, flèches pour le déplacer\./, '') : m;
function toast(msg, action){
  msg = forTouch(msg);
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role','status');
  const sp = document.createElement('span'); sp.textContent = msg; t.appendChild(sp);
  if (action){ const b = document.createElement('button'); b.textContent = action.label; b.onclick = () => { action.fn(); t.remove(); }; t.appendChild(b); }
  document.body.appendChild(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), action ? 7000 : 4200);
}
function busy(on, msg){
  let b = $('.busy');
  if (on){ if (!b){ b = document.createElement('div'); b.className = 'busy'; document.body.appendChild(b); } b.textContent = msg || 'Traitement…'; }
  else if (b) b.remove();
}

/* ---------- loading ---------- */
/* in-page question box (the viewer and the Windows app have no confirm()) */
function ask(title, msg, buttons){
  return new Promise(res => {
    closeModal();
    modal = document.createElement('div'); modal.className = 'modal';
    modal.innerHTML = '<div class="card" role="alertdialog" aria-modal="true"><h2></h2><p class="hint" style="margin:0"></p><div class="row" style="justify-content:flex-end"></div></div>';
    modal.querySelector('h2').textContent = title; modal.querySelector('p').textContent = msg;
    const row = modal.querySelector('.row');
    buttons.forEach(b => { const x = document.createElement('button'); x.type = 'button'; x.className = 'btn' + (b.pri ? ' pri' : ''); x.textContent = b.label; x.onclick = () => { if (modal) modal._onEsc = null; closeModal(); res(b.value); }; row.appendChild(x); });
    modal._onEsc = () => res(null);
    document.body.appendChild(modal);
    const pri = row.querySelector('.pri'); if (pri) pri.focus();
  });
}
async function confirmDiscard(){
  if (!S.dirty || !S.pages.length) return true;
  const r = await ask('Modifications non enregistrées', 'Le document « ' + S.name + ' » a été modifié. Voulez-vous enregistrer les modifications ?',
    [{ label: 'Annuler', value: 'cancel' }, { label: 'Ne pas enregistrer', value: 'discard' }, { label: 'Enregistrer', value: 'save', pri: true }]);
  if (r === 'discard') return true;
  if (r === 'save') return await save();
  return false;
}
async function loadPdf(bytes, name, append, path){
  if (!append && !(await confirmDiscard())) return false;
  if (!append) S._wasProtected = false;
  const dec = await decryptIfNeeded(bytes, name); if (!dec) return false; bytes = dec;
  busy(true, 'Ouverture du PDF…');
  try {
    const doc = await pdfjs.getDocument({ data: bytes.slice(), isEvalSupported: false, fontExtraProperties: true }).promise;
    if (!append){ S.docs = []; S.pages = []; S.proxies = {}; S.items = {}; S.annots = {}; S.form = {}; S.doc = {}; S.hist = []; S.fut = []; S.sel = null; S.name = name; S.path = path || null; FM.map = {}; FM.lib = {}; closeSearch(); }
    const di = S.docs.length;
    S.docs.push({ bytes, name, doc });
    for (let i = 0; i < doc.numPages; i++){
      S.proxies[di + ':' + i] = await doc.getPage(i + 1);
      S.pages.push({ id: uid(), doc: di, index: i, rot: 0, objs: [] });
    }
    $('#fname').textContent = S.name;
    if (!append){ setDirty(false); fitWidth(true); if (S._wasProtected) toast('Document protégé ouvert. Il sera enregistré sans mot de passe, sauf si vous utilisez « Protéger ».'); } else { setDirty(true); renderAll(true); }
    renderComments(); renderCtx();
    updUndo();
    if (append) toast(doc.numPages + ' page(s) ajoutée(s) à la fin du document');
    return true;
  } catch (e) {
    console.error(e);
    toast(e && e.name === 'PasswordException' ? 'Ce PDF est protégé par mot de passe. Retirez la protection avant de l’ouvrir ici.' : 'Impossible de lire ce fichier. Vérifiez qu’il s’agit bien d’un PDF.');
    return false;
  } finally { busy(false); }
}
async function getAnnots(p){
  const k = key(p);
  if (!S.annots[k]){ S.annots[k] = proxy(p).getAnnotations({ intent: 'display' }).catch(() => []); }
  return S.annots[k];
}
async function readFile(file, append){
  if (!file) return;
  let path = null; try { if (window.glApp && window.glApp.pathForFile) path = window.glApp.pathForFile(file) || null; } catch(e){}
  const bytes = new Uint8Array(await file.arrayBuffer());
  await loadPdf(bytes, file.name, append, path);
}
function openDialog(){
  if (!once('open', 400)) return;
  if (window.glApp && window.glApp.openDialog) window.glApp.openDialog(); else $('#fOpen').click();
}
$('#bOpen').onclick = openDialog;
$('#bAdd').onclick = () => { if (!S.docs.length) return $('#fOpen').click(); $('#fAdd').click(); };
$('#fOpen').onchange = e => { readFile(e.target.files[0], false); e.target.value = ''; };
$('#fAdd').onchange = e => { readFile(e.target.files[0], true); e.target.value = ''; };
let dropEl;
viewer.addEventListener('dragover', e => { e.preventDefault(); if (!dropEl){ dropEl = document.createElement('div'); dropEl.className = 'drop'; dropEl.textContent = 'Déposez le PDF pour l’ouvrir'; viewer.appendChild(dropEl); } });
viewer.addEventListener('dragleave', e => { if (e.target === viewer && dropEl){ dropEl.remove(); dropEl = null; } });
viewer.addEventListener('drop', e => {
  e.preventDefault(); if (dropEl){ dropEl.remove(); dropEl = null; }
  const f = [...e.dataTransfer.files].find(f => /pdf$/i.test(f.type) || /\.pdf$/i.test(f.name));
  if (f) readFile(f, false); else if (e.dataTransfer.files.length) toast('Seuls les fichiers PDF peuvent être ouverts.');
});

/* ---------- rendering ---------- */
const io = new IntersectionObserver(ents => ents.forEach(en => { en.target._vis = en.isIntersecting; if (en.isIntersecting) renderCanvas(en.target); }), { root: viewer, rootMargin: '600px 0px' });
const tio = new IntersectionObserver(ents => ents.forEach(en => { if (en.isIntersecting) renderThumb(en.target); }), { root: $('#pPages'), rootMargin: '300px 0px' });

function renderAll(keepScroll){
  const st = viewer.scrollTop, sl = viewer.scrollLeft;
  io.disconnect(); tio.disconnect();
  pagesEl.innerHTML = ''; thumbs.innerHTML = '';
  if (!S.pages.length){
    pagesEl.innerHTML = '<div class="empty"><h1>G&amp;L PDF</h1><p>Ouvrez un document PDF pour le lire, le modifier, l’annoter ou le signer.</p>' +
      '<button class="save" id="emptyOpen" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Ouvrir un PDF</button>' +
      '<p class="hint">ou glissez un fichier PDF dans cette fenêtre</p></div>';
    const eo = document.getElementById('emptyOpen'); if (eo) eo.onclick = () => $('#fOpen').click();
    $('#pInfo').hidden = true; return;

async function applyForms(srcs){
  const byDoc = {};
  for (const k in S.form){ const i = k.indexOf(':'); const d = +k.slice(0, i); (byDoc[d] = byDoc[d] || {})[k.slice(i + 1)] = S.form[k]; }
  const problems = [];
  for (const d in byDoc){
    let form; try { form = srcs[d].getForm(); } catch(e){ continue; }
    for (const name in byDoc[d]){
      const v = byDoc[d][name];
      try {
        const fld = form.getField(name), T = fld.constructor.name;
        if (fld instanceof PDFLib.PDFTextField){ let t = String(v || ''); const ml = fld.getMaxLength(); if (ml && t.length > ml) t = t.slice(0, ml); fld.setText(t); }
        else if (fld instanceof PDFLib.PDFCheckBox){ v ? fld.check() : fld.uncheck(); }
        else if (fld instanceof PDFLib.PDFRadioGroup){
          if (v && v !== 'Off'){ const opts = fld.getOptions(); if (opts.includes(v)) fld.select(v); else if (/^\d+$/.test(v) && opts[+v] != null) fld.select(opts[+v]); else fld.select(v); }
          else fld.clear();
        }
        else if (fld instanceof PDFLib.PDFDropdown || fld instanceof PDFLib.PDFOptionList){ if (v) fld.select(v); else fld.clear(); }
        else void T;
      } catch(e){ console.warn('champ', name, e); problems.push(name); }
    }
    try { form.updateFieldAppearances(); } catch(e){ console.warn('apparence des champs', e); }
  }
  return problems;
}
/* keeps the copied form fields fillable in other PDF readers */
function rebuildAcroForm(out, srcs){
  const L = PDFLib, N = n => L.PDFName.of(n), ctx2 = out.context, roots = new Set(), rootRefs = [];
  for (const pg of out.getPages()){
    const annots = pg.node.Annots(); if (!annots) continue;
    for (let i = 0; i < annots.size(); i++){
      let ref = annots.get(i), d = ctx2.lookup(ref);
      if (!(d instanceof L.PDFDict)) continue;
      const st = d.get(N('Subtype')); if (!st || st.toString() !== '/Widget') continue;
      let guard = 0;
      while (guard++ < 20){ const par = d.get(N('Parent')); if (!(par instanceof L.PDFRef)) break; ref = par; d = ctx2.lookup(par); if (!(d instanceof L.PDFDict)) break; }
      const key2 = ref.toString(); if (!roots.has(key2)){ roots.add(key2); rootRefs.push(ref); }
    }
  }
  if (!rootRefs.length) return;
  const af = ctx2.obj({ Fields: rootRefs });
  try {
    const src = srcs.find(sd => { try { return sd.catalog.lookup(N('AcroForm')); } catch(e){ return false; } });
    if (src){
      const saf = src.catalog.lookup(N('AcroForm')), cp = L.PDFObjectCopier.for(src.context, ctx2);
      const da = saf.get(N('DA')); if (da) af.set(N('DA'), da);
      const dr = saf.get(N('DR')); if (dr) af.set(N('DR'), cp.copy(dr));
    }
  } catch(e){ console.warn(e); }
  out.catalog.set(N('AcroForm'), ctx2.register(af));
}

const SR = { q: '', list: [], cur: -1, token: 0 };
const normCh = c => { const n = c.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); return n.length === 1 ? n : c.toLowerCase(); };
function openSearch(){
  if (!S.pages.length) return;
  $('#searchBar').hidden = false; const q = $('#sQ'); q.focus(); q.select();
}
function closeSearch(){
  $('#searchBar').hidden = true; SR.list = []; SR.cur = -1; SR.q = ''; $('#sCount').textContent = '';
  pagesEl.querySelectorAll('.page').forEach(drawHits);
}
async function runSearch(q){
  const tok = ++SR.token; SR.q = q; SR.list = []; SR.cur = -1;
  if (!q.trim()){ $('#sCount').textContent = ''; pagesEl.querySelectorAll('.page').forEach(drawHits); return; }
  const nq = [...q].map(normCh).join('');
  for (const p of S.pages){
    const items = await getItems(p); if (tok !== SR.token) return;
    items.concat(items.vert || []).forEach(it => {
      if (!it) return;
      const ns = [...it.str].map(normCh).join('');
      let i = ns.indexOf(nq);
      while (i >= 0){ SR.list.push({ p, it, i, n: nq.length }); i = ns.indexOf(nq, i + Math.max(1, nq.length)); }
    });
  }
  $('#sCount').textContent = SR.list.length ? '' : 'Aucun résultat';
  if (SR.list.length) gotoHit(0); else pagesEl.querySelectorAll('.page').forEach(drawHits);
}
function gotoHit(i){
  if (!SR.list.length) return;
  SR.cur = (i + SR.list.length) % SR.list.length;
  $('#sCount').textContent = (SR.cur + 1) + ' sur ' + SR.list.length;
  pagesEl.querySelectorAll('.page').forEach(drawHits);
  const h = SR.list[SR.cur], el = pageEl(h.p); if (!el) return;
  const hb = hitBox(h), x = hb.x * S.scale, y = hb.y * S.scale;
  const er = el.getBoundingClientRect(), vr = viewer.getBoundingClientRect();
  viewer.scrollTop += (er.top + y) - (vr.top + viewer.clientHeight * 0.35);
  const tx = er.left + x - vr.left; if (tx < 40 || tx > viewer.clientWidth - 40) viewer.scrollLeft += tx - viewer.clientWidth / 2;
}
function drawHits(el){
  const hl = el.querySelector('.hits'); if (!hl) return; hl.innerHTML = '';
  if (!SR.list.length) return;
  SR.list.forEach((h, k) => {
    if (h.p !== el._p) return;
    const r = hitBox(h);
    const d = document.createElement('div'); d.className = 'hit' + (k === SR.cur ? ' cur' : '');
    Object.assign(d.style, { left: r.x * S.scale + 'px', top: r.y * S.scale + 'px', width: Math.max(2, r.w * S.scale) + 'px', height: Math.max(2, r.h * S.scale) + 'px' });
    hl.appendChild(d);
  });
}
function hitBox(h){
  if (h.it.vbox) return h.it.vbox;
  const ed = charEdges(h.it), x1 = ed[h.i], x2 = ed[Math.min(h.i + h.n, h.it.str.length)];
  return { x: x1, y: h.it.base - h.it.fh * 0.88, w: x2 - x1, h: h.it.fh * 1.12 };
}
let searchT;
$('#sQ').addEventListener('input', () => { clearTimeout(searchT); searchT = setTimeout(() => runSearch($('#sQ').value), 220); });

  if (e.key === 'Enter'){ e.preventDefault(); if (SR.q !== $('#sQ').value) runSearch($('#sQ').value); else gotoHit(SR.cur + (e.shiftKey ? -1 : 1)); }
  else if (e.key === 'Escape'){ e.preventDefault(); closeSearch(); }
});

async function printDoc(){
  if (!once('print', 800)) return;
  if (!S.pages.length){ toast('Ouvrez d’abord un PDF.'); return; }
  if (IN_CLAUDE && !ELECTRON){ toast('L’impression n’est pas disponible dans cet affichage : enregistrez le PDF puis imprimez-le.'); return; }
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  busy(true, 'Préparation de l’impression…');
  const area = $('#printArea'); area.innerHTML = '';
  try {
    const bytes = await buildPdf({ internal: true });
    const doc = await pdfjs.getDocument({ data: bytes, isEvalSupported: false }).promise;
    for (let i = 1; i <= doc.numPages; i++){
      const pg = await doc.getPage(i), v1 = pg.getViewport({ scale: 1 });
      const sc = Math.min(2.4, Math.sqrt(MAX_PX / (v1.width * v1.height)));
      const vp = pg.getViewport({ scale: sc }), c = document.createElement('canvas');
      c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
      await pg.render({ canvasContext: c.getContext('2d'), viewport: vp, annotationMode: pdfjs.AnnotationMode.ENABLE_FORMS }).promise;
      const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.92));
      const im = new Image(); im.src = URL.createObjectURL(blob); im.alt = '';
      await new Promise(r => { im.onload = r; im.onerror = r; });
      area.appendChild(im);
    }
    doc.destroy();
  } catch(e){ console.error(e); busy(false); toast('Impossible de préparer l’impression.'); area.innerHTML = ''; return; }
  busy(false);
  const clean = () => { area.querySelectorAll('img').forEach(im => URL.revokeObjectURL(im.src)); area.innerHTML = ''; window.removeEventListener('afterprint', clean); };
  window.addEventListener('afterprint', clean);
  setTimeout(() => { try { window.print(); } catch(e){ toast('L’impression n’est pas disponible ici.'); clean(); } }, 50);
}

/* « 1-3, 5, 8- » → indices (0-based) parmi n pages */
function parseRange(str, n){
  const out = new Set(), t = String(str || '').replace(/\s/g, '');
  if (!t) return [...Array(n).keys()];
  for (const part of t.split(/[,;]/)){
    if (!part) continue;
    const m = part.match(/^(\d*)-(\d*)$/);
    if (m){ let a = m[1] ? +m[1] : 1, b = m[2] ? +m[2] : n; if (a > b) [a, b] = [b, a]; for (let i = Math.max(1, a); i <= Math.min(n, b); i++) out.add(i - 1); }
    else if (/^\d+$/.test(part)){ const i = +part; if (i >= 1 && i <= n) out.add(i - 1); }
    else return null;
  }
  return [...out].sort((x, y) => x - y);
}

  const title = kind === 'retour' ? '[Retour version] demandé par ' + who : '[G&L PDF] ' + text.replace(/\s+/g, ' ').trim().slice(0, 80);
  const body = kind === 'retour' ? 'Revenir à la version précédente de l’éditeur.\n\nDemandé par : ' + who + '\n\n' + appInfo()
    : '## Demande\n\n' + text.trim() + '\n\n## Contexte (ajouté automatiquement)\n\nDemandé par : ' + who + '\n' + appInfo() + (glErrs.length ? '\n\nDernières erreurs techniques :\n```\n' + glErrs.join('\n') + '\n```' : '');
  const is = await gh('/issues', { method: 'POST', body: JSON.stringify({ title, body }) });
  const a = myReqs(); a.push({ n: is.number, t: kind === 'retour' ? 'Revenir à la version précédente' : text.trim().slice(0, 120), d: Date.now() }); saveReqs(a);
  return is.number;
}
async function reqStatus(n){
  const is = await gh('/issues/' + n);
  const cm = await gh('/issues/' + n + '/comments?per_page=30');
  const last = cm.length ? cm[cm.length - 1].body : '';
  const done = is.state === 'closed', okv = (last.match(/version (\d+\.\d+\.\d+)/) || [])[1];
  const icon = !done ? '⏳' : /^✅/.test(last) ? '✅' : /^⚠️|^❌/.test(last) ? '⚠️' : '💬';
  return { n, done, icon, last: last.replace(/<details>[\s\S]*<\/details>/, '').replace(/\*\*/g, '').trim(), version: okv };
}

async function imagesToPdf(files, fit){
  const d = await PDFLib.PDFDocument.create();
  for (const f of files){
    const url = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(f); });
    const im = await new Promise((r, j) => { const x = new Image(); x.onload = () => r(x); x.onerror = () => j(new Error('Image illisible : ' + f.name)); x.src = url; });
    let bytes, img;
    if (/^data:image\/jpe?g/.test(url)){ bytes = await f.arrayBuffer(); img = await d.embedJpg(bytes); }
    else { const c = document.createElement('canvas'); c.width = im.naturalWidth; c.height = im.naturalHeight; const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0);
      img = await d.embedJpg(await (await canvasBlob(c, 'image/jpeg', 0.92)).arrayBuffer()); }
    const W = img.width * 0.75, H = img.height * 0.75;
    if (fit === 'a4'){
      const land = W > H, pw = land ? 841.89 : 595.28, ph = land ? 595.28 : 841.89, m = 28, k = Math.min((pw - 2 * m) / W, (ph - 2 * m) / H, 1);
      const pg = d.addPage([pw, ph]); pg.drawImage(img, { x: (pw - W * k) / 2, y: (ph - H * k) / 2, width: W * k, height: H * k });
    } else { const pg = d.addPage([W, H]); pg.drawImage(img, { x: 0, y: 0, width: W, height: H }); }
  }
  return new Uint8Array(await d.save());
}
async function textToPdf(text, name){
  const d = await PDFLib.PDFDocument.create(), f = await d.embedFont(PDFLib.StandardFonts.Helvetica), size = 11, lh = 14.5, m = 56, W = 595.28, H = 841.89, maxW = W - 2 * m;
  const safe = s => [...s].map(ch => { try { f.encodeText(ch); return ch; } catch(e){ return '?'; } }).join('');
  let pg = d.addPage([W, H]), y = H - m;
  for (const para of text.replace(/\r\n?/g, '\n').split('\n')){
    const words = safe(para).split(/(\s+)/); let line = '';
    const flush = () => { if (y < m){ pg = d.addPage([W, H]); y = H - m; } pg.drawText(line, { x: m, y, size, font: f }); y -= lh; line = ''; };
    for (const w of words){ if (f.widthOfTextAtSize(line + w, size) > maxW && line.trim()){ flush(); line = w.trimStart(); } else line += w; }
    flush();
  }
  d.setTitle(name); return new Uint8Array(await d.save());
}
async function createPdf(kind){
  let bytes, name;
  if (kind === 'blank'){ const d = await PDFLib.PDFDocument.create(); d.addPage([595.28, 841.89]); bytes = new Uint8Array(await d.save()); name = 'Nouveau document.pdf'; }
  else if (kind === 'images'){
    const files = await pickFiles('image/*', true); if (!files.length) return;
    const v = await dialog('Créer un PDF à partir de ' + files.length + ' image(s)', '<div class="form-grid"><label>Format des pages</label><select name="fit"><option value="a4">A4 (image centrée)</option><option value="img">Taille de chaque image</option></select></div>', 'Créer');
    if (!v) return; busy(true, 'Création du PDF…'); try { bytes = await imagesToPdf(files, v.fit); } finally { busy(false); }
    name = files[0].name.replace(/\.[^.]+$/, '') + '.pdf';
  } else if (kind === 'txt'){
    const files = await pickFiles('.txt,text/plain', false); if (!files.length) return;
    bytes = await textToPdf(await files[0].text(), files[0].name); name = files[0].name.replace(/\.[^.]+$/, '') + '.pdf';
  } else if (kind === 'clip'){
    toast('Copiez une image (capture d’écran…) puis appuyez sur Ctrl+V dans cette fenêtre.'); waitPasteImage = true; return;
  }
  if (await loadPdf(bytes, name, false)) setDirty(true);
}
let waitPasteImage = false;
document.addEventListener('paste', async e => {

ACT.combine = async () => {
  let files = await pickFiles('application/pdf,.pdf,image/*', true); if (!files.length) return;
  const listHtml = () => files.map((f, i) => '<div class="fi"><span>' + esc(f.name) + '</span><button type="button" class="chip" data-up="' + i + '" title="Monter">▲</button><button type="button" class="chip" data-dn="' + i + '" title="Descendre">▼</button><button type="button" class="chip" data-rm="' + i + '" title="Retirer">×</button></div>').join('');
  const v = await dialog('Combiner des fichiers', '<p class="hint" style="margin:0 0 8px">Les fichiers seront assemblés dans cet ordre. Les images deviennent des pages A4.</p><div class="flist" id="cList"></div><div class="row" style="margin-top:8px"><button type="button" class="btn" id="cAdd">Ajouter des fichiers…</button><label style="display:flex;gap:6px;align-items:center;font-size:13px"><input type="checkbox" name="withCur"' + (S.pages.length ? ' checked' : ' disabled') + '> Inclure le document ouvert en premier</label></div>', 'Combiner', form => {
    const L = form.querySelector('#cList'), draw = () => { L.innerHTML = listHtml(); };
    draw();
    L.onclick = e => { const b = e.target.closest('button'); if (!b) return; const i = +(b.dataset.up ?? b.dataset.dn ?? b.dataset.rm);
      if (b.dataset.rm != null) files.splice(i, 1); else if (b.dataset.up != null && i > 0) files.splice(i - 1, 0, files.splice(i, 1)[0]); else if (b.dataset.dn != null && i < files.length - 1) files.splice(i + 1, 0, files.splice(i, 1)[0]); draw(); };
    form.querySelector('#cAdd').onclick = async () => { files = files.concat(await pickFiles('application/pdf,.pdf,image/*', true)); draw(); };
    form._validate = v2 => (!files.length && !v2.withCur) ? 'Ajoutez au moins un fichier.' : null;
  });
  if (!v) return;
  progress('Assemblage des fichiers…', 0);
  try {
    const out = await PDFLib.PDFDocument.create();
    const parts = [];
    if (v.withCur && S.pages.length) parts.push({ bytes: await buildPdf({ internal: true }), name: S.name });
    for (const f of files){
      if (/pdf$/i.test(f.type) || /\.pdf$/i.test(f.name)) parts.push({ bytes: await decryptIfNeeded(new Uint8Array(await f.arrayBuffer()), f.name), name: f.name });
      else parts.push({ bytes: await imagesToPdf([f], 'a4'), name: f.name });
    }
    for (let k = 0; k < parts.length; k++){
      progress('Assemblage : ' + parts[k].name, k / parts.length);
      if (!parts[k].bytes) continue;
      const src = await PDFLib.PDFDocument.load(parts[k].bytes, { ignoreEncryption: true });
      (await out.copyPages(src, src.getPageIndices())).forEach(pg => out.addPage(pg));
    }
    busy(false);
    if (!out.getPageCount()){ toast('Aucune page à assembler.'); return; }
    const bytes = new Uint8Array(await out.save());
    S.dirty = false; // le document ouvert est inclus dans l'assemblage
    if (await loadPdf(bytes, (v.withCur && S.pages.length ? baseName() : files[0].name.replace(/\.[^.]+$/, '')) + '-combine.pdf', false)){ setDirty(true); toast(out.getPageCount() + ' pages assemblées.'); }
  } catch(e){ busy(false); throw e; }
};

async function thumbCanvas(p, w){
  const base = getVP(p, 1), sc = w / base.width, vp = getVP(p, sc * DPR), c = document.createElement('canvas');
  c.width = Math.floor(vp.width); c.height = Math.floor(vp.height); c.style.width = (vp.width / DPR) + 'px';
  try { await proxy(p).render({ canvasContext: c.getContext('2d'), viewport: vp }).promise; } catch(e){}
  return c;
}

      grid.innerHTML = '';
      for (let i = 0; i < S.pages.length; i++){
        const p = S.pages[i], c = document.createElement('div'); c.className = 'oc'; c._p = p; c.draggable = true;

        c.addEventListener('drop', e => { e.preventDefault(); c.classList.remove('dragover'); const to = S.pages.indexOf(p); if (dragIdx == null || dragIdx === to) return;
          const moving = sel.has(S.pages[dragIdx].id) && sel.size > 1 ? S.pages.filter(x => sel.has(x.id)) : [S.pages[dragIdx]];
          pushHist(); const rest = S.pages.filter(x => !moving.includes(x)); let at = rest.indexOf(p); if (to > dragIdx) at++; rest.splice(at < 0 ? rest.length : at, 0, ...moving); S.pages = rest; changed = true; dragIdx = null; draw(); });
      }

    const targets = () => sel.size ? S.pages.filter(p => sel.has(p.id)) : [];

      else if (o === 'del'){ if (T.length >= S.pages.length){ toast('Il doit rester au moins une page.'); return; } pushHist(); S.pages = S.pages.filter(p => !sel.has(p.id)); sel.clear(); changed = true; await draw(); }
      else if (o === 'blank'){ const i = T.length ? S.pages.indexOf(T[T.length - 1]) : S.pages.length - 1; await insertBlank(i, true); changed = true; await draw(); }
      else if (o === 'file'){ const i = T.length ? S.pages.indexOf(T[T.length - 1]) : S.pages.length - 1; if (await insertFromFile(i + 1)){ changed = true; await draw(); } }

/* rotation d'une page avec ses éléments ajoutés */
function rotatePage(p, deg, silent){
  const v0 = getVP(p, 1); p.rot = (p.rot + deg) % 360; const v1 = getVP(p, 1);
  const m = (x, y) => { const q = v0.convertToPdfPoint(x, y); return v1.convertToViewportPoint(q[0], q[1]); };
  const box = b => { const a1 = m(b.x, b.y), a2 = m(b.x + b.w, b.y + b.h); return { x: Math.min(a1[0], a2[0]), y: Math.min(a1[1], a2[1]), w: Math.abs(a2[0] - a1[0]), h: Math.abs(a2[1] - a1[1]) }; };
  p.objs.forEach(o => {
    if (o.pts) o.pts = o.pts.map(pt => m(pt[0], pt[1]).map(n => Math.round(n * 10) / 10));
    else if (o.type === 'text' || o.type === 'edit' || o.type === 'note'){ const q = m(o.x, o.y); o.x = q[0]; o.y = q[1]; if (o.wipe) o.wipe = box(o.wipe); }
    else Object.assign(o, box(o));
  });
  if (p.ocr) p.ocr = p.ocr.map(w => Object.assign({}, w, box(w), { rot: ((w.rot || 0) + deg) % 360 }));
  if (p.crop) p.crop = box(p.crop);
  if (!silent) renderAll(true);
}

async function insertFromFile(at){

ACT.detect = async () => {
  let added = 0; pushHist();
  for (const p of S.pages){
    const items = await getItems(p);
    for (const it of items){
      const ed = charEdges(it), str = it.str, re = /_{4,}|\.{6,}|…{3,}|☐|□/g; let m;
      while ((m = re.exec(str))){
        const a = ed[m.index], b = ed[m.index + m[0].length], isBox = /☐|□/.test(m[0]);

        const fh = it.fh, o = isBox ? { kind: 'check', name: 'Case_' + cnt, x: a, y: it.base - fh * 0.8, w: fh * 0.9, h: fh * 0.9 } : { kind: 'text', name: 'Texte_' + cnt, x: a, y: it.base - fh * 1.05, w: b - a, h: fh * 1.25 };
        p.objs.push(Object.assign({ id: uid(), type: 'field', options: '', group: '' }, o)); added++;
      }
    }
  }
  if (!added){ S.hist.pop(); updUndo(); toast('Aucun champ détecté (lignes « ____ », pointillés « ...... » ou cases ☐). Utilisez « Ajouter des champs ».'); return; }
  renderAll(true); setTool('field', true); toast(added + ' champ(s) détecté(s). Cliquez sur un champ pour le renommer ou le supprimer.');
};

/* ---------- protéger ---------- */
async function encryptPdf(bytes, userPw, ownerPw, perms){
  const X = window.PDFLibX; if (!X) throw new Error('module de chiffrement indisponible');
  const d = await X.PDFDocument.load(bytes);
  d.encrypt({ userPassword: userPw || '', ownerPassword: ownerPw || userPw || '', permissions: perms });
  return new Uint8Array(await d.save());
}
/* déchiffre un PDF protégé (avec mot de passe si besoin) ; renvoie null si l'utilisateur abandonne */
async function decryptIfNeeded(bytes, name){

  if (!enc){ try { const d = await PDFLib.PDFDocument.load(bytes, { ignoreEncryption: true, updateMetadata: false }); enc = d.isEncrypted; } catch(e){ return bytes; } }
  if (!enc || !window.PDFLibX) return bytes;
  const X = window.PDFLibX;
  try { const d = await X.PDFDocument.load(bytes, { password: '' }); const out = new Uint8Array(await d.save()); S._wasProtected = true; return out; } catch(e){}
  for (let tries = 0; tries < 5; tries++){
    const v = await dialog('Document protégé', '<p style="margin:0 0 8px">« ' + esc(name) + ' » est protégé par un mot de passe.</p><div class="form-grid"><label>Mot de passe</label><input type="password" name="pw" autocomplete="off"></div>' + (tries ? '<p class="hint" style="color:#c0392b">Mot de passe incorrect, réessayez.</p>' : ''), 'Ouvrir');
    if (!v) return null;
    try { const d = await X.PDFDocument.load(bytes, { password: v.pw }); S._wasProtected = true; return new Uint8Array(await d.save()); } catch(e){}
  }
  toast('Mot de passe incorrect.'); return null;
}

ACT.findredact = async () => {
  const v = await dialog('Rechercher et biffer', '<div class="form-grid"><label>Mots ou expressions</label><textarea name="q" rows="3" placeholder="Un par ligne"></textarea><label>Ou un modèle</label><span style="display:flex;flex-direction:column;gap:4px">' +

  });
  if (!v) return;
  const pats = v.q.split('\n').map(x => x.trim()).filter(Boolean).map(w => new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'));
  if (v.tel) pats.push(/(?:\+33\s?|0)[1-9](?:[\s.-]?\d{2}){4}/g);

  if (v.num) pats.push(/\b[12]\s?\d{2}\s?\d{2}\s?\d{2}\s?\d{3}\s?\d{3}(?:\s?\d{2})?\b/g);
  let n = 0; const before = snap();
  for (const p of S.pages){
    const items = await getItems(p);
    for (const it of items){ const ed = charEdges(it);
      for (const re of pats){ re.lastIndex = 0; let m; while ((m = re.exec(it.str))){ if (!m[0].length){ re.lastIndex++; continue; }
        const a = ed[m.index], b = ed[m.index + m[0].length];
        p.objs.push({ id: uid(), type: 'redact', color: '#000000', x: a - 0.5, y: it.base - it.fh * 0.92, w: b - a + 1, h: it.fh * 1.2 }); n++; } }
    }

};

/* ---------- compresser ---------- */
async function compressBytes(bytes, level){

    const filt = dict.get(N('Filter')), fstr = filt ? filt.toString() : '';

    const w = dict.get(N('Width')).asNumber(), h = dict.get(N('Height')).asNumber();
    if (w * h < 40000) continue;
    let canvas = null;
    try {
      if (fstr === '/DCTDecode'){
        const cs = dict.get(N('ColorSpace')); if (cs && !/DeviceRGB|DeviceGray/.test(cs.toString())) continue;
        const im = await new Promise((res, rej) => { const x = new Image(); x.onload = () => res(x); x.onerror = rej; x.src = URL.createObjectURL(new Blob([obj.contents], { type: 'image/jpeg' })); });

        canvas.getContext('2d').drawImage(im, 0, 0, canvas.width, canvas.height); URL.revokeObjectURL(im.src);
      } else if (fstr === '/FlateDecode' && !dict.get(N('DecodeParms'))){
        const cs = dict.get(N('ColorSpace')), bpc = dict.get(N('BitsPerComponent')); if (!cs || !bpc || bpc.asNumber() !== 8) continue;
        const ncomp = cs.toString() === '/DeviceRGB' ? 3 : cs.toString() === '/DeviceGray' ? 1 : 0; if (!ncomp) continue;
        const raw = L.decodePDFRawStream(obj).decode(); if (raw.length < w * h * ncomp) continue;
        const c0 = document.createElement('canvas'); c0.width = w; c0.height = h; const g0 = c0.getContext('2d'), id = g0.createImageData(w, h);
        for (let i = 0, j = 0; i < w * h; i++, j += ncomp){ id.data[i * 4] = raw[j]; id.data[i * 4 + 1] = raw[j + (ncomp === 3 ? 1 : 0)]; id.data[i * 4 + 2] = raw[j + (ncomp === 3 ? 2 : 0)]; id.data[i * 4 + 3] = 255; }
        g0.putImageData(id, 0, 0);
        const k = Math.min(1, maxDim / Math.max(w, h)); canvas = document.createElement('canvas'); canvas.width = Math.round(w * k); canvas.height = Math.round(h * k);
        canvas.getContext('2d').drawImage(c0, 0, 0, canvas.width, canvas.height);
      } else continue;
      const jpg = new Uint8Array(await (await canvasBlob(canvas, 'image/jpeg', q)).arrayBuffer());
      if (jpg.length >= obj.contents.length * 0.92) continue;
      const nd = d.context.obj({ Type: 'XObject', Subtype: 'Image', Width: canvas.width, Height: canvas.height, ColorSpace: 'DeviceRGB', BitsPerComponent: 8, Filter: 'DCTDecode', Length: jpg.length });
      d.context.assign(ref, L.PDFRawStream.of(nd, jpg)); changed++;
    } catch(e){ console.warn('image ignorée', e); }
  }

}

/* ---------- Scan et OCR ---------- */
let ocrWorker = null;
async function getOcr(onProg){
  if (ocrWorker) return ocrWorker;
  const core = document.getElementById('tessCore').textContent, wk = document.getElementById('tessWorker').textContent;
  // les données du français sont livrées avec le logiciel : le moteur les lit sans connexion internet
  const fra = document.getElementById('tessFra').textContent.trim();
  const shim = 'self.__glFra = "' + fra + '";\n(function(){ var f0 = self.fetch; self.fetch = function(u, o){ if (String(u).indexOf("glpdf.local/fra.traineddata") >= 0){ var b = atob(self.__glFra), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return Promise.resolve(new Response(a)); } return f0.apply(self, arguments); }; })();\n';
  const url = URL.createObjectURL(new Blob([shim, core, '\n;\n', wk], { type: 'text/javascript' }));
  ocrWorker = await Tesseract.createWorker('fra', 1, { workerPath: url, workerBlobURL: false, langPath: 'https://glpdf.local', cacheMethod: 'none', gzip: true, logger: m => onProg && onProg(m) });
  return ocrWorker;
}
ACT.ocr = async () => {

  const v = await dialog('Scan et OCR', '<p style="margin:0 0 8px">' + (pagesNoText.length ? pagesNoText.length + ' page(s) sans texte (scannées) détectée(s).' : 'Toutes les pages contiennent déjà du texte.') + '</p><div class="form-grid"><label>Pages</label><select name="which"><option value="scan">Pages scannées uniquement</option><option value="all">Toutes les pages</option><option value="cur">Page affichée</option></select><label>Langue</label><span>Français</span></div><p class="hint">Le texte reconnu devient cherchable, sélectionnable et modifiable. L’image de la page n’est pas modifiée.</p>', 'Lancer la reconnaissance', form => {
    if (!pagesNoText.length) form.which.value = 'cur';
  });
  if (!v) return;
  const list = v.which === 'all' ? S.pages.slice() : v.which === 'cur' ? [currentPage() || S.pages[0]] : pagesNoText;
  if (!list.length){ toast('Aucune page à traiter.'); return; }
  const before = snap(); let words = 0;
  try {
    progress('Chargement de la reconnaissance de texte…', 0);
    const w = await getOcr();
    for (let k = 0; k < list.length; k++){
      const p = list[k]; progress('Reconnaissance du texte : page ' + (S.pages.indexOf(p) + 1) + ' (' + (k + 1) + '/' + list.length + ')', k / list.length);
      const v1 = getVP(p, 1), sc = Math.min(300 / 72, Math.sqrt(MAX_PX / (v1.width * v1.height)));
      const vp = getVP(p, sc), c = document.createElement('canvas'); c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
      await proxy(p).render({ canvasContext: g, viewport: vp }).promise;
      const r = await w.recognize(c);
      const lines = []; (r.data.lines || []).forEach(l => { const t = (l.text || '').trim(); if (!t || (l.confidence != null && l.confidence < 35)) return;
        const b = l.bbox; lines.push({ text: t.replace(/\s+/g, ' '), x: b.x0 / sc, y: b.y0 / sc, w: (b.x1 - b.x0) / sc, h: (b.y1 - b.y0) / sc }); words += t.split(/\s+/).length; });

  } catch(e){ busy(false); console.error(e); toast('La reconnaissance a échoué : ' + (e && e.message || e)); }

/* ---------- exporter ---------- */
async function exportItems(doc){
  // lignes de texte de chaque page du PDF final (avec gras, taille et position)
  const pages = [];
  for (let i = 1; i <= doc.numPages; i++){
    const pg = await doc.getPage(i), vp = pg.getViewport({ scale: 1 }), tc = await pg.getTextContent();
    const its = [];
    for (const it of tc.items){
      if (!it.str || !it.str.trim()) continue;
      const tx = pdfjs.Util.transform(vp.transform, it.transform), fh = Math.hypot(tx[2], tx[3]);
      if (Math.abs(tx[1]) > 0.05 * fh) continue;
      let fname = ''; try { const f = pg.commonObjs.get(it.fontName); fname = (f && f.name) || ''; } catch(e){}
      its.push({ s: it.str, x: tx[4], y: tx[5], w: it.width, fh, bold: /bold|black|heavy|semibold|demi/i.test(fname), italic: /italic|oblique/i.test(fname), serif: /times|serif|georgia|garamond|roman/i.test(fname + ' ' + ((tc.styles[it.fontName] || {}).fontFamily || '')) && !/sans/i.test(fname) });
    }
    its.sort((a, b) => a.y - b.y || a.x - b.x);
    const rows = [];
    for (const it of its){ const r = rows.find(r2 => Math.abs(r2.y - it.y) < Math.max(2, it.fh * 0.35)); if (r){ r.items.push(it); r.fh = Math.max(r.fh, it.fh); } else rows.push({ y: it.y, fh: it.fh, items: [it] }); }
    rows.forEach(r => r.items.sort((a, b) => a.x - b.x));
    rows.sort((a, b) => a.y - b.y);
    pages.push({ w: vp.width, h: vp.height, rows, page: pg });
  }
  return pages;
}
/* découpe une ligne en cellules (grands espaces) */
function rowCells(r){
  const cells = []; let cur = null;
  for (const it of r.items){
    if (cur && it.x - (cur.x + cur.w) < Math.max(it.fh, cur.fh) * 1.6){ const gap = it.x - (cur.x + cur.w); cur.s += (gap > it.fh * 0.18 && !/\s$/.test(cur.s) && !/^\s/.test(it.s) ? ' ' : '') + it.s; cur.w = it.x + it.w - cur.x; cur.bold = cur.bold && it.bold; }
    else { cur = Object.assign({}, it); cells.push(cur); }
  }
  return cells;
}

    if (hf && idx + 1 >= (hf.from || 1)){

function shareSheet(file, bytes){

let saving = false;
function outName(){

}
/* returns true when the file was saved */
